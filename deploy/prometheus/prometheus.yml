global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'flashsale-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080', 'host.docker.internal:8080']
        labels:
          service: 'flashsale-gateway'

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8081', 'host.docker.internal:8081']
        labels:
          service: 'order-service'

  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['inventory-service:8082', 'host.docker.internal:8082']
        labels:
          service: 'inventory-service'

  - job_name: 'payment-fulfillment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-fulfillment-service:8083', 'host.docker.internal:8083']
        labels:
          service: 'payment-fulfillment-service'
