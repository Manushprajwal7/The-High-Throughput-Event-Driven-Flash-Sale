spring:
  datasource:
    url: jdbc:h2:mem:payment_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

flashsale:
  kafka:
    consumer-enabled: false
  expiry:
    enabled: false
  reconciliation:
    enabled: false
  simulation:
    payment-mode: ALWAYS_SUCCESS
    latency-ms: 0
